<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>100 Days Trace Code THPTQG 2027</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 font-sans min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;

    const QUESTIONS = [
      {
        day: 1,
        type: "code",
        title: "Lựa chọn ngôn ngữ lập trình Python hoặc C++ để tìm hiểu đoạn chương trình sau:",
        pythonCode: `def sort_algo(A, n):\n    for i in range(n - 1):\n        for j in range(n - 1 - i):\n            if A[j] > A[j + 1]:\n                A[j], A[j + 1] = A[j + 1], A[j]`,
        cppCode: `void sort_algo(int A[], int n) {\n    for (int i = 0; i < n - 1; i++) {\n        for (int j = 0; j < n - 1 - i; j++) {\n            if (A[j] > A[j + 1]) {\n                int temp = A[j];\n                A[j] = A[j + 1];\n                A[j + 1] = temp;\n            }\n        }\n    }\n}`,
        statements: [
          "Hàm sort_algo thể hiện thuật toán Sắp xếp chèn (Insertion Sort).",
          "Thao tác cơ bản nhất của thuật toán này là so sánh và đổi chỗ hai phần tử kề nhau nếu chúng bị ngược thứ tự.",
          "Độ phức tạp thời gian của thuật toán này luôn là O(n^2) trong mọi trường hợp do có hai vòng lặp lồng nhau.",
          "Nếu truyền mảng đầu vào A = [5, 2, 8, 1] và n = 4, sau khi kết thúc vòng lặp ngoài (biến i) lần ĐẦU TIÊN (i = 0), phần tử lớn nhất là 8 sẽ được đẩy về cuối mảng."
        ],
        answers: [false, true, true, true],
        explanation: `PHÂN TÍCH CHUNG:
+ Hàm sort_algo có hai tham số: 1. A: danh sách A. 2. n: số lượng phần tử của danh sách A.
+ Bên trong bao gồm 2 vòng for lồng nhau → độ phức tạp O(n²).
+ Vòng for đầu tiên: Biến i nhận các giá trị từ 0 đến n-2.
+ Vòng for thứ hai nằm phía bên trong: Biến j nhận các giá trị từ 0 đến n-i-2.
+ Câu lệnh if bên trong vòng for thứ hai:
  - Điều kiện kiểm tra: A[j] > A[j+1].
  - Nếu thỏa mãn điều kiện thì thực hiện câu lệnh A[j], A[j+1] = A[j+1], A[j]. Câu lệnh này sẽ thực hiện hoán đổi giá trị của A[j] và A[j+1] cho nhau.

VÍ DỤ MINH HỌA:
Lấy ví dụ với mảng vào A = [5, 2, 8, 1] và n = 4.
+ Vòng for ngoài, biến i nhận giá trị từ 0 đến 2 (do n-1=4-1=3, range(3)=0,1,2).
- Vòng for ngoài lặp lần 1, với biến i=0:
  Khi i=0 thì n-i-1=4-0-1=3, range(3)=0,1,2. Do đó vòng for trong, biến j nhận giá trị từ 0 đến 2.

  + Vòng for trong lặp lần 1, với biến j=0:
    * Khi đó A[j]=A[0]=5, A[j+1]=A[1]=2.
    * So sánh: A[j] > A[j+1], thỏa mãn điều kiện của câu lệnh if.
    * Hoán đổi A[j] và A[j+1], khi đó A[j]=2, A[j+1]=5.
    * Mảng A=[2,5,8,1].

  + Vòng for trong lặp lần 2, với biến j=1:
    * Khi đó A[j]=A[1]=5, A[j+1]=A[2]=8.
    * So sánh: A[j] < A[j+1], không thỏa mãn điều kiện của câu lệnh if.
    * Không thực hiện hoán đổi.
    * Mảng A=[2,5,8,1].

  + Vòng for trong lặp lần 3, với biến j=2:
    * Khi đó A[j]=A[2]=8, A[j+1]=A[3]=1.
    * So sánh: A[j] > A[j+1], thỏa mãn điều kiện của câu lệnh if.
    * Hoán đổi A[j] và A[j+1], khi đó A[j]=1, A[j+1]=8.
    * Mảng A=[2,5,1,8].

Nhận xét: Sau khi kết thúc lặp lần 1 của vòng for ngoài, PHẦN TỬ LỚN NHẤT CỦA MẢNG ĐÃ ĐƯỢC ĐẨY RA CUỐI CÙNG – VỊ TRÍ CÓ CHỈ SỐ LÀ N-1. Việc này có thể hiểu là phần tử lớn nhất “đã nổi lên” → Đây chính là Thuật toán Sắp xếp nổi bọt (Bubble Sort).

Thực hiện tương tự với các lần lặp còn lại, lần lượt “làm nổi lên” các phần tử lớn thứ 2 lên vị trí chỉ số n-2, phần tử lớn thứ 3 lên vị trí chỉ số n-3. Phần tử cuối cùng sẽ luôn nằm đúng vị trí vì hiển nhiên các phần tử trước đã đúng vị trí.

PHÂN TÍCH PHÁT BIỂU:
a) Sai (Bubble Sort – Sắp xếp nổi bọt).
b) Đúng.
c) Đúng.
d) Đúng.`
      }
    ];

    function App() {
      const [currentDay, setCurrentDay] = useState(1);
      const [userAnswers, setUserAnswers] = useState([null, null, null, null]);
      const [isSubmitted, setIsSubmitted] = useState(false);

      const question = QUESTIONS.find((q) => q.day === currentDay) || QUESTIONS[0];

      const handleSelect = (idx, value) => {
        if (isSubmitted) return;
        const newAns = [...userAnswers];
        newAns[idx] = value;
        setUserAnswers(newAns);
      };

      const isAllAnswered = userAnswers.every((v) => v !== null);

      const calculateScore = () => {
        return userAnswers.reduce((score, ans, idx) => score + (ans === question.answers[idx] ? 1 : 0), 0);
      };

      const handleNextDay = () => {
        const nextDay = currentDay + 1;
        const hasNextQuestion = QUESTIONS.some((q) => q.day === nextDay);

        if (hasNextQuestion) {
          setIsSubmitted(false);
          setUserAnswers([null, null, null, null]);
          setCurrentDay(nextDay);
        } else {
          alert(`⚠️ Chưa có dữ liệu cho Ngày ${nextDay}! Bạn đã hoàn thành hết các bài hiện có.`);
        }
      };

      const getButtonStyle = (idx, btnValue) => {
        const userAns = userAnswers[idx];
        const correctAns = question.answers[idx];

        // 1. Khi CHƯA nộp bài: Chọn thì đổi màu trung tính xám đậm, KHÔNG xanh/đỏ
        if (!isSubmitted) {
          if (userAns === btnValue) {
            return "bg-slate-600 border-slate-300 text-white font-bold shadow-md scale-105";
          }
          return "bg-slate-800 border-slate-700 text-slate-400 hover:bg-slate-700/80";
        }

        // 2. Khi ĐÃ nộp bài: Tô màu đáp án Đúng/Sai
        if (correctAns === btnValue) {
          // Đáp án đúng luôn tô XANH
          return "bg-emerald-600 border-emerald-400 text-white font-bold ring-2 ring-emerald-400/50";
        }
        if (userAns === btnValue && userAns !== correctAns) {
          // Đáp án người dùng chọn bị SAI -> tô ĐỎ
          return "bg-rose-600 border-rose-400 text-white font-bold ring-2 ring-rose-400/50";
        }

        // Các nút không liên quan bị làm mờ
        return "bg-slate-800/40 border-slate-700/50 text-slate-600 opacity-40";
      };

      const labels = ["a", "b", "c", "d"];

      return (
        <main className="p-4 md:p-8">
          <div className="max-w-4xl mx-auto space-y-6">
            <header className="flex justify-between items-center bg-slate-800 p-4 rounded-xl border border-slate-700">
              <h1 className="text-xl font-bold text-emerald-400">🔥 100 Days Trace Code THPTQG 2027</h1>
              <span className="text-sm text-slate-400">Ngày {question.day} / 100</span>
            </header>

            <div className="bg-slate-800 border border-slate-700 rounded-xl p-6 space-y-6">
              <p className="text-base text-slate-200 font-medium">
                <span className="text-amber-400 font-bold mr-2">Câu {question.day}:</span>
                {question.title}
              </p>

              {question.type === "code" && (
                <div className="grid grid-cols-1 md:grid-cols-2 gap-4 border border-slate-700 rounded-lg overflow-hidden bg-slate-950">
                  <div className="border-b md:border-b-0 md:border-r border-slate-700 p-4">
                    <div className="text-emerald-400 font-bold text-sm mb-2">🐍 Python</div>
                    <pre className="font-mono text-emerald-300 text-xs md:text-sm overflow-x-auto"><code>{question.pythonCode}</code></pre>
                  </div>
                  <div className="p-4">
                    <div className="text-cyan-400 font-bold text-sm mb-2">⚡ C++</div>
                    <pre className="font-mono text-cyan-300 text-xs md:text-sm overflow-x-auto"><code>{question.cppCode}</code></pre>
                  </div>
                </div>
              )}

              <div className="space-y-3">
                <p className="text-sm font-semibold text-slate-400">Mỗi phát biểu sau đây là Đúng hay Sai?</p>
                <div className="border border-slate-700 rounded-lg divide-y divide-slate-700 bg-slate-900/50">
                  {question.statements.map((text, idx) => {
                    const isCorrect = userAnswers[idx] === question.answers[idx];

                    return (
                      <div key={idx} className="p-4 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
                        <div className="text-sm text-slate-200 flex-1 flex items-start gap-2">
                          <span className="font-bold text-amber-400 shrink-0">{labels[idx]})</span>
                          <span className="flex-1">{text}</span>
                          
                          {/* Dấu Tích (✓) hoặc Dấu X (✗) hiển thị sau khi nộp bài */}
                          {isSubmitted && (
                            <span className="font-bold text-base shrink-0 ml-1">
                              {isCorrect ? (
                                <span className="text-emerald-400 bg-emerald-950/80 border border-emerald-500/30 px-2 py-0.5 rounded-full inline-flex items-center gap-1 text-xs">
                                  ✓ Đúng
                                </span>
                              ) : (
                                <span className="text-rose-400 bg-rose-950/80 border border-rose-500/30 px-2 py-0.5 rounded-full inline-flex items-center gap-1 text-xs">
                                  ✗ Sai
                                </span>
                              )}
                            </span>
                          )}
                        </div>

                        <div className="flex gap-2 shrink-0 self-end sm:self-auto">
                          <button
                            onClick={() => handleSelect(idx, true)}
                            disabled={isSubmitted}
                            className={`px-3.5 py-1.5 rounded text-xs transition-all duration-150 ${getButtonStyle(idx, true)}`}
                          >
                            ĐÚNG
                          </button>
                          <button
                            onClick={() => handleSelect(idx, false)}
                            disabled={isSubmitted}
                            className={`px-3.5 py-1.5 rounded text-xs transition-all duration-150 ${getButtonStyle(idx, false)}`}
                          >
                            SAI
                          </button>
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>

              {!isSubmitted ? (
                <button
                  onClick={() => setIsSubmitted(true)}
                  disabled={!isAllAnswered}
                  className="w-full py-3 bg-emerald-500 hover:bg-emerald-600 disabled:opacity-40 text-slate-950 font-bold rounded-lg transition-colors"
                >
                  Nộp bài & Chấm điểm
                </button>
              ) : (
                <div className="space-y-4 pt-2 border-t border-slate-700">
                  <div className="p-4 bg-slate-950 rounded-lg text-center font-bold">
                    Kết quả: <span className="text-amber-400">{calculateScore()}/4</span> ý chính xác
                  </div>
                  <div className="bg-slate-950 p-4 rounded-lg font-mono text-sm text-slate-300 whitespace-pre-wrap leading-relaxed">
                    {question.explanation}
                  </div>
                  <button onClick={handleNextDay} className="w-full py-3 bg-blue-600 hover:bg-blue-500 font-bold rounded-lg transition-colors">
                    Chuyển sang Ngày tiếp theo →
                  </button>
                </div>
              )}
            </div>
          </div>
        </main>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
